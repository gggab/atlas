# Local ACP workbench workspace.
[workspace]
resolver = "2"
members = [
    "crates/atlas-acp-thread",
    "crates/atlas-agent-delta",
    "crates/atlas-agent-manager",
    "crates/atlas-agent-servers",
    "crates/atlas-agent-store",
    "crates/atlas-agent-transcript",
    "crates/atlas-agent-wire",
    "crates/atlas-bus",
    "crates/atlas-checkpoint",
    "crates/atlas-codeindex",
    "crates/atlas-embed",
    "crates/atlas-git",
    "crates/atlas-gitdiff",
    "crates/atlas-icon-theme",
    "crates/atlas-instruction-sync",
    "crates/atlas-memory",
    "crates/atlas-process",
    "crates/atlas-profile",
    "crates/atlas-redact",
    "crates/atlas-terminal",
    "crates/atlas-theme",
    "crates/atlas-thread-metadata",
    "src-tauri",
]
exclude = ["crates/atlas-kb-server"]

[workspace.dependencies]
axum = { version = "0.8", default-features = false }
dirs = "6"
notify = "8.2.0"
rmcp = { version = "=3.0.0", default-features = false }
schemars = "0.8.22"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1"
toml = "0.9.5"

[workspace.lints]

# Unknown feature gates fail compilation instead of silently removing behavior.
rust = { unexpected_cfgs = "deny" }

[workspace.lints.clippy]

# `unwrap_used` and `expect_used` are STAGED, not enforced: turning the table
# on for the first-party members (#60) surfaced ~220 violations of the pair,
# overwhelmingly in test code where a panic IS the failure report. Re-add them
# behind a cleanup pass rather than allowlisting two hundred call sites in one
# sweep. Every other deny below is live and clean.
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"

# An allow, not a deny. `#[async_trait]` marks every method it generates
# `#[must_use]` while returning a boxed `Future`, already must-use, and from
# clippy 1.99 this lint flags each expansion: atlas-memory's traits and generated service traits, none of
# it code anyone wrote. A hand-written redundant `#[must_use]` is harmless.
double_must_use = "allow"


[profile.release]
codegen-units = 1   # Single codegen unit → better cross-function inlining
lto = "thin"        # Thin LTO: cross-crate inlining and DCE in parallel, per
                    # codegen unit, instead of one serial whole-program merge
strip = "symbols"   # Smaller .app bundle, faster dyld load
panic = "unwind"    # REQUIRED — three independent `catch_unwind` guards depend on
                    # it, so this survived the local-LLM removal:
                    #  1. atlas-embed's EMBEDDER catches candle's Metal
                    #     kernel-compile panic (at load AND per forward) to fall
                    #     back to CPU rather than crash.
                    #  2. commands/capture.rs guards its worker threads — a
                    #     panicking worker is silent capture loss.
                    #  3. atlas-checkpoint wraps atlas-redact, so a redaction
                    #     panic can never leak unredacted text.
                    # `abort` would turn each of these into an app crash. Costs a
                    # little binary size for unwind tables.
opt-level = 3       # Default for release, restated for clarity

# Build scripts and proc-macro crates are COMPILE-TIME ONLY — none of their
# code is linked into the shipped binary, and LTO never touches them. Without
# this stanza they inherit `opt-level = 3` / `codegen-units = 1` from the
# profile above, so the build spends real time optimizing 317 build scripts and
# 143 proc-macro dylibs whose only job is to run once and exit.
#
# `opt-level = 0` makes them compile fast and run slower; the trade is only
# worth it while the running is cheap relative to the compiling, which it is
# here (measure before assuming it holds — a proc-macro-bound build can invert
# it). Shipped output is bit-identical either way: this cannot affect binary
# size, speed, or the `panic = "unwind"` guarantees above.
[profile.release.build-override]
opt-level = 0
codegen-units = 256

# Dev profile — Atlas's own app crate is small (~170 LOC + a handful of
# command modules). Keep it at the default `opt-level = 0` so incremental
# rebuilds stay snappy. Its per-package stanza is deliberately absent below.
[profile.dev]
# Full DWARF for workspace members + their deps produced a 104 GB `target/debug` and
# paid for itself on every link. `line-tables-only` keeps what is actually read
# day to day — panic backtraces with file:line, and profiler symbols — and drops
# only variable inspection in a debugger. Restore `debug = true` locally (never
# commit it) on the rare occasion you need to step through Rust in lldb.
debug = "line-tables-only"

# Optimize ALL transitive dependencies in dev mode at `opt-level = 1`
# (Tauri, wry, tao, tokio, serde, reqwest, the old vendored SDK forks, etc.).
# First clean build pays a one-time ~3–5 minute cost; subsequent rebuilds only
# recompile the app crate and are unaffected. Net effect: `bunx tauri dev`
# startup drops noticeably because Tauri's runtime is no longer running
# unoptimized debug code.
[profile.dev.package."*"]
opt-level = 1
# No debug info for third-party dependencies. `[profile.dev]` keeps
# `line-tables-only` for workspace members, which is where file:line in a
# backtrace is ever read; for the ~1,000 crates below, DWARF was emitted on
# every clean build and sat in target/debug/deps for nothing. Function names
# and `panic!` locations do not come from debug info and are unaffected.
debug = false

# `"*"` above reaches dependencies ONLY — workspace members are excluded from
# it by cargo. Before the workspace, every `crates/atlas-*` package was a plain
# path dependency of src-tauri and therefore covered; as members they would
# silently drop to opt-level 0 and `tauri dev` would run the ACP stack, the
# terminal, the embedder and the RAG engine unoptimized. Restating the level
# per member is the only way to express "unchanged" (D4: "preserve dev-profile
# opt-levels for workspace members explicitly").
#
# Adding a member means adding a stanza here; `tests/cargo-workspace.test.ts`
# fails if one is missing.
[profile.dev.package.atlas-acp-thread]
opt-level = 1
[profile.dev.package.atlas-agent-delta]
opt-level = 1
[profile.dev.package.atlas-agent-manager]
opt-level = 1
[profile.dev.package.atlas-agent-servers]
opt-level = 1
[profile.dev.package.atlas-agent-store]
opt-level = 1
[profile.dev.package.atlas-agent-transcript]
opt-level = 1
[profile.dev.package.atlas-agent-wire]
opt-level = 1

[profile.dev.package.atlas-bus]
opt-level = 1
[profile.dev.package.atlas-checkpoint]
opt-level = 1
[profile.dev.package.atlas-codeindex]
opt-level = 1

[profile.dev.package.atlas-embed]
opt-level = 1
[profile.dev.package.atlas-git]
opt-level = 1
[profile.dev.package.atlas-gitdiff]
opt-level = 1
[profile.dev.package.atlas-icon-theme]
opt-level = 1
[profile.dev.package.atlas-instruction-sync]
opt-level = 1
[profile.dev.package.atlas-memory]
opt-level = 1

[profile.dev.package.atlas-process]
opt-level = 1
[profile.dev.package.atlas-profile]
opt-level = 1
[profile.dev.package.atlas-redact]
opt-level = 1
[profile.dev.package.atlas-terminal]
opt-level = 1
[profile.dev.package.atlas-theme]
opt-level = 1
[profile.dev.package.atlas-thread-metadata]
opt-level = 1

# The vendored engine's members, same reasoning as the stanzas above (#65).
# #42's exemption — "quarantined, on no runtime path until the seam is rewired
# (#45)" — expired when #45 and #54 landed: the engine now runs on EVERY dev
# turn (streaming, rollout I/O, sandboxing, apply-patch, ~600k LOC), and at
# the profile's opt-level 0 it was the slowest code on the hottest path. The
# cost is a longer first clean build; the `"*"` override cannot cover these
# because workspace members are excluded from it by cargo. Generated from the
# member list — a new vendored member belongs here too, and
# tests/cargo-workspace.test.ts fails if it is missing.
#
# `incremental = false` on every one of them: these crates change only when
# the fork is patched, so incremental state (14.6 GB of target/debug, the
# bulk of it) was write-once and never re-read. Non-incremental codegen is
# also faster on a first compile and, unlike incremental units, is cacheable
# by a rustc wrapper such as sccache. The trade: editing a vendored crate
# recompiles that crate from scratch. Atlas's own members stay incremental.
