[package]
name = "atlas-ssh"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
russh = "0.63.3"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
zeroize = "1"
atlas-redact = { path = "../atlas-redact" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native", "apple-native"] }

[dev-dependencies]
tempfile = "3"
rand = "0.10"

[lints]
workspace = true
